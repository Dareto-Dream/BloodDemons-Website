<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - PixooCalendar</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="script.js"></script>
</head>
<body>

<header>
    <div class="logo">PixooCalendar</div>
    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="features.html">Features</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>
</header>

<main>
    <section class="hero">
        <h1>Contact Us</h1>
        <p>Have questions? Feel free to reach out!</p>
    </section>

    <section class="contact-container">
        <div class="contact-info">
            <h2>📧 Email</h2>
            <p><a href="mailto:dare.to.0ream@gmail.com">dare.to.0ream@gmail.com</a></p>
        </div>

        <div class="contact-form">
            <h2>💬 Send a Message</h2>
            <form action="mailto:dare.to.0ream@gmail.com" method="post" enctype="text/plain">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>

                <label for="message">Message</label>
                <textarea id="message" name="message" rows="4" required></textarea>

                <button type="submit">Send</button>
            </form>
        </div>
    </section>
</main>

<footer>
    <p>&copy; 2025 PixooCalendar. All Rights Reserved.</p>
</footer>

</body>
</html>
